name: Native Image Build (Linux ARM64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'

      - name: Build native image
        run: |
          mvn package -Dpackaging=native-image -DskipTests \
            -Dnative.buildArgs="--strict-image-heap -march=armv8-a -O2"

      - name: Strip debug symbols
        run: strip --strip-all target/xdcc-java

      - name: Show binary size
        run: ls -lh target/xdcc-java

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdcc-java-linux-arm64
          path: target/xdcc-java
